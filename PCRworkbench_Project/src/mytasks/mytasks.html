<div id="view-task" class="view-task" style="display:none">
<div class="cols">
    <!-- CENTER：对话形态（与 Create PCR 一致） -->
    <main class="center">
      <div class="task-bar" id="centerHead"></div>
      <div class="center-body" id="centerBody"></div>
      <div class="askwrap task-askwrap" id="taskAskwrap">
        <div class="ask">
          <div style="position:relative">
            <span class="tipdot abs" onclick="showTip(event,'taskChat',53)">53</span>
            <span class="tipdot abs" style="right:14px" onclick="showTip(event,'askOne',56)">56</span>
          </div>
          <div class="guide" id="taskGuide">
            <div class="guide-g">提问与分析 <span>围绕当前任务追问</span></div>
            <button class="guide-i" type="button" data-tq="为什么参考 X1 Carbon G12 那条案例">为什么参考 X1 Carbon G12 那条案例</button>
            <button class="guide-i" type="button" data-tq="如果我投 Disagree，后续会怎么走">如果我投 Disagree，后续会怎么走</button>
            <button class="guide-i" type="button" data-tq="Schedule 影响这条校验具体要补什么">Schedule 影响这条校验具体要补什么</button>
            <button class="guide-i" type="button" data-tq="历史上同类换代有没有出过 BIOS 兼容问题">历史上同类换代有没有出过 BIOS 兼容问题</button>
          </div>
          <div class="ask-stack">
            <div class="plusmenu" id="taskPlusmenu">
              <button type="button" data-tp="comment"><span class="pm-t">✎ 修改 Comment 草稿</span><span class="pm-s">让 AI 改写上方草稿</span></button>
              <div class="pm-div"></div>
              <button type="button" data-tp="sim"><span class="pm-t">🔍 查询相似案例</span><span class="pm-s">补充可比 PCR</span></button>
              <div class="pm-div"></div>
              <button type="button" data-tp="valid"><span class="pm-t">ⓘ 解释校验项</span><span class="pm-s">Schedule / Evidence 等</span></button>
              <div class="pm-div"></div>
              <button type="button" data-tp="file"><span class="pm-t">📎 上传附件</span><span class="pm-s">证据 / 邮件 / 截图</span></button>
            </div>
            <div class="askbox" id="taskAskbox">
              <button class="plusbtn" id="taskPlusbtn" type="button" title="更多">+</button>
              <div class="agent-wrap" id="taskAgentWrap">
                <button type="button" class="agent-chip" id="taskAgentChip" aria-haspopup="listbox" aria-expanded="false" title="选择 Agent" onclick="toggleAgentMenu(event,'task')">
                  <svg class="agent-mark" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3.2" r="1.6"/><circle cx="3.2" cy="8" r="1.6"/><circle cx="12.8" cy="8" r="1.6"/><circle cx="8" cy="12.8" r="1.6"/></svg>
                  <span class="agent-chip-lab" id="taskAgentChipLab">@Agent</span>
                  <svg class="agent-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5L6 7.5 9 4.5"/></svg>
                </button>
                <div class="agent-menu" id="taskAgentMenu" hidden role="listbox" aria-label="选择 Agent">
                  <div class="agent-menu-h">选择 Agent</div>
                  <button type="button" class="agent-opt on" data-agent="pcr" role="option" aria-selected="true">
                    <svg class="agent-mark" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3.2" r="1.6"/><circle cx="3.2" cy="8" r="1.6"/><circle cx="12.8" cy="8" r="1.6"/><circle cx="8" cy="12.8" r="1.6"/></svg>
                    <span class="agent-opt-t"><b>PCR Agent</b><small>当前使用</small></span>
                    <svg class="agent-check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
                  </button>
                  <button type="button" class="agent-opt browse" data-agent-browse role="option">
                    <svg class="agent-grid" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
                    <span class="agent-opt-t"><b>浏览其他 Agent</b></span>
                    <svg class="agent-next" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 3L7.5 6 4.5 9"/></svg>
                  </button>
                </div>
              </div>
              <textarea class="askin" id="taskAskin" rows="1" placeholder="补充信息…"></textarea>
              <button class="send" id="taskSend" type="button"><svg class="i" style="width:14px;height:14px"><path d="M3 8h9M8.5 4l3.5 4-3.5 4"/></svg></button>
            </div>
          </div>
          <input type="file" id="taskfile" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.eml,.msg,.txt" style="display:none">
        </div>
      </div>
    </main>

    <!-- RIGHT：收起后显示窄条，点一下即可再展开 PCR Details -->
    <button type="button" class="ctx-rail" id="ctxRailBtn" title="显示 PCR Details" aria-label="显示 PCR Details" aria-expanded="true">
      <svg class="ctx-rail-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M10 3v10"/><path d="M6.8 6.2L4.8 8l2 1.8"/></svg>
      <span class="ctx-rail-lab">PCR Details</span>
    </button>
    <aside class="ctx" id="taskCtx">
      <div class="ctx-head">
        <div class="ctx-tabs">
          <button class="ctx-tab on" data-t="detail">PCR Details</button><span class="tipdot" onclick="showTip(event,'ctx',31)">31</span>
          <button class="ctx-tab" data-t="similar">Similar PCR</button><span class="tipdot" onclick="showTip(event,'sim',32)">32</span>
          <button class="ctx-tab" data-t="evidence">AI Evidence</button><span class="tipdot" onclick="showTip(event,'tevi',33)">33</span>
          <button class="ctx-tab" data-t="approval">Approval History</button><span class="tipdot" onclick="showTip(event,'ahSplit',62)">62</span>
        </div>
        <button type="button" class="ctx-collapse" id="ctxCollapseBtn" title="隐藏 PCR Details" aria-label="隐藏 PCR Details" aria-expanded="true">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M10 3v10"/><path d="M6.8 6.2L4.8 8l2 1.8"/></svg>
        </button>
      </div>
      <div class="ctx-body" id="ctxBody"></div>
    </aside>
  </div>

      </div>
    </div>
