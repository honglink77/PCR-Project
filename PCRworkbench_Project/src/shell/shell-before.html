

<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
      <div class="logo"><span class="mk">P</span>PCR <small id="crumb">Overview</small></div>
      <div class="sp"></div>
      <div class="sesswrap" id="sesswrap">
        <button type="button" class="sesschip empty" id="sesschip" title="新会话">
          <svg class="i sess-ico" viewBox="0 0 16 16"><path d="M3 4.5h10a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 13 12.5H7l-3 2v-2H3A1.5 1.5 0 0 1 1.5 11V6A1.5 1.5 0 0 1 3 4.5z"/></svg>
          <span class="sess-title" id="sessTitle">新会话</span>
          <span class="sess-status" id="sessStatus" hidden></span>
          <span class="sess-caret" id="sessCaret" hidden>▾</span>
        </button>
        <span class="tipdot" onclick="showTip(event,'sessTop',50)">50</span>
        <div class="sessmenu" id="sessmenu" hidden>
          <button type="button" class="sm-i" data-act="pin"><span class="sm-ico">📌</span><span class="sm-lab" id="sessPinLab">Pin</span><span class="sm-k">P</span></button>
          <button type="button" class="sm-i" data-act="rename"><span class="sm-ico">✎</span><span class="sm-lab">Rename</span><span class="sm-k">R</span></button>
          <div class="sm-div"></div>
          <button type="button" class="sm-i danger" data-act="delete"><span class="sm-ico">🗑</span><span class="sm-lab">Delete</span><span class="sm-k">D</span></button>
        </div>
      </div>
      <span class="tipdot" onclick="showTip(event,'mode',1)">1</span>
      <button class="sel" onclick="toast('切换时间范围')">近 90 天<svg class="i" style="width:13px;height:13px"><path d="M4 6.5L8 10l4-3.5"/></svg></button>
      <button class="sel" onclick="toast('切换 BU')">全部 BU<svg class="i" style="width:13px;height:13px"><path d="M4 6.5L8 10l4-3.5"/></svg></button>
      <button class="ibtn" onclick="toast('3 条未读通知')"><svg class="i"><path d="M8 2a4 4 0 0 0-4 4v3l-1.4 2.4h10.8L12 9V6a4 4 0 0 0-4-4z"/><path d="M6.6 13a1.5 1.5 0 0 0 2.8 0"/></svg><span class="bd">3</span></button>
      <div class="usermenu">
        <button class="av" onclick="toggleMenu(event)">JC</button>
        <div class="umenu" id="umenu">
          <div class="um-h"><div class="um-av">JC</div><div><div class="um-n">Jordan</div><div class="um-r">OTM · DTIT AI+</div></div></div>

          <div class="um-sec">原型模式</div>
          <div class="modesw">
            <button id="mDemo" class="on" onclick="setMode('demo')"><svg class="i" style="width:12px;height:12px"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.8"/></svg>演示</button>
            <button id="mDisc" onclick="setMode('discuss')"><svg class="i" style="width:12px;height:12px"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1z"/><path d="M8 7v4M8 4.6h.01"/></svg>讨论</button>
          </div>
          <div class="um-hint" id="umhint">演示模式：已隐藏全部说明标记</div>

          <div class="um-tools" id="umtools">
            <div class="um-sec">评审工具 <span id="ncnt">已记录 0 条</span></div>
            <button class="um-i" onclick="closeMenu();openList()"><svg class="i"><path d="M6 4h7M6 8h7M6 12h7M3 4h.01M3 8h.01M3 12h.01"/></svg>结论清单</button>
            <button class="um-i" onclick="closeMenu();expMd()"><svg class="i"><path d="M8 2v8M5 7.5L8 10.5l3-3M3 13h10"/></svg>导出纪要（Markdown）</button>
            <button class="um-i" onclick="closeMenu();expHtml()"><svg class="i"><path d="M5.5 3H3v10h10V8"/><path d="M9 3h4v4"/><path d="M7 9l6-6"/></svg>导出批注版原型</button>
            <button class="um-i" onclick="closeMenu();document.getElementById('impf').click()"><svg class="i"><path d="M8 10V2M5 4.5L8 1.5l3 3M3 13h10"/></svg>导入他人批注</button>
            <input type="file" id="impf" accept=".json" style="display:none" onchange="impJson(this)">
            <button class="um-i danger" onclick="closeMenu();clearAll()"><svg class="i"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5"/></svg>清空全部结论</button>
          </div>

          <div class="um-div"></div>
          <button class="um-i" onclick="toast('账号设置')"><svg class="i"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M2.5 8h2M11.5 8h2M4.1 4.1l1.4 1.4M10.5 10.5l1.4 1.4M11.9 4.1l-1.4 1.4M5.5 10.5l-1.4 1.4"/></svg>账号设置</button>
        </div>
      </div>
  </div>

  <!-- LEFT RAIL -->
  <aside class="rail">
    <div class="rail-top">
      <button class="newchat" onclick="newChatSession()" title="New Chat">
        <svg class="i"><path d="M8 3v10M3 8h10"/></svg><span class="newchat-label">New Chat</span>
      </button>
      <button class="railtoggle" onclick="toggleRail()" title="Collapse sidebar">
        <svg class="i"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg>
      </button>
    </div>

    <div style="position:relative"><span class="tipdot abs" onclick="showTip(event,'nav',2)">2</span></div>
    <nav class="nav">
      <button class="navitem on" data-view="home" onclick="switchView('home')"><svg class="i"><rect x="2" y="2" width="5.5" height="5.5" rx="1.5"/><rect x="8.5" y="2" width="5.5" height="5.5" rx="1.5"/><rect x="2" y="8.5" width="5.5" height="5.5" rx="1.5"/><rect x="8.5" y="8.5" width="5.5" height="5.5" rx="1.5"/></svg>Overview</button>
      <button class="navitem" data-view="task" onclick="switchView('task')"><svg class="i"><path d="M5.5 2h5a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 10.5 14h-5A1.5 1.5 0 0 1 4 12.5v-9A1.5 1.5 0 0 1 5.5 2z"/><path d="M6.5 6h3M6.5 9h3"/></svg>My Tasks<span class="cnt hot">3</span></button>
    </nav>

    <!--RAIL_MYTASKS-->
    <!--RAIL_OVERVIEW-->

    <div class="rail-foot">
      <button class="navitem" onclick="toast('设置')"><svg class="i"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M2.5 8h2M11.5 8h2M4.1 4.1l1.4 1.4M10.5 10.5l1.4 1.4M11.9 4.1l-1.4 1.4M5.5 10.5l-1.4 1.4"/></svg>设置</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="scroll">
